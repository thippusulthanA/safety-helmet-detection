version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: helmet-detection-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/backend/models
      - ./backend/static:/app/backend/static
      - ./backend/helmet_detection.db:/app/backend/helmet_detection.db
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: helmet-detection-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

